
# Goal: Build and push the Chattingo frontend image

name: Docker Build & Push

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

permissions:
  contents: read

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout practice repository
        uses: actions/checkout@v4

      - name: Checkout Chattingo project
        uses: actions/checkout@v4
        with:
          repository: Ashish-6-24/chattingo
          ref: main
          path: chattingo

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Docker Login
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push
        uses: docker/build-push-action@v5
        with:
          context: ./chattingo/frontend
          file: ./chattingo/frontend/Dockerfile
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/master' }}
          tags: |
            ${{ vars.DOCKERHUB_USERNAME }}/chattingo-frontend-github-action:latest
            ${{ vars.DOCKERHUB_USERNAME }}/chattingo-frontend-github-action:sha-${{ github.sha }}

