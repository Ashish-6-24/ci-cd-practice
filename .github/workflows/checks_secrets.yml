
name: Github Secrets

on:
  workflow_dispatch:

jobs:
  checks_secret:
    runs-on: ubuntu-latest

    steps:
      - name: Check whether the secret is set
        env:
          MY_SECRET_MESSAGE: ${{ secrets.MY_SECRET_MESSAGE }}
        shell: bash
        run: |
          if [[ -n "$MY_SECRET_MESSAGE" ]]; then
            echo "The secret is set: true"
          else
            echo "The secret is set: false"
            exit 1
          fi

      - name: Verify Docker Hub secrets
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_TOKEN: ${{ secrets.DOCKER_TOKEN }}
        shell: bash
        run: |
          if [[ -n "$DOCKER_USERNAME" && -n "$DOCKER_TOKEN" ]]; then
            echo "Docker Hub secrets are configured."
          else
            echo "One or more Docker Hub secrets are missing."
            exit 1
          fi

