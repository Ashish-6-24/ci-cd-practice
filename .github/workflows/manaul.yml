name: Manual Environment Workflow
on:
  workflow_dispatch:
    inputs:
      environment:
        description: Select the environment
        required: true
        type: choice
        options:
          - staging
          - production
          - developer
        default: staging

jobs:
  show-environment:
    runs-on: ubuntu-latest

    steps:
      - name: Print selected environment
        run: | echo "Selected environment: ${{ inputs.environment }}"
